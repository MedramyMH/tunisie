{% extends "base.html" %}
{% block title %}Downloader & Editor - TunisiaHub{% endblock %}
{% block content %}
<div class="flex gap-4 mb-6 border-b border-gray-700 pb-4">
    <button onclick="showTab('tab-download')" class="tab-btn px-4 py-2 rounded bg-blue-600">⬇️ Download</button>
    <button onclick="showTab('tab-tools')" class="tab-btn px-4 py-2 rounded bg-gray-800 hover:bg-gray-700">🎞️ Video Tools</button>
</div>

<!-- TAB 1: DOWNLOAD -->
<div id="tab-download" class="tab-content">
    <div class="bg-gray-800 p-6 rounded-xl max-w-2xl">
        <h3 class="text-xl font-bold mb-4">URL Downloader</h3>
        <input type="text" id="dl-url" placeholder="YouTube / TikTok / Facebook URL" class="w-full bg-gray-900 p-3 rounded mb-4 border border-gray-700">
        <div class="flex gap-4">
            <select id="dl-format" class="flex-1 bg-gray-900 p-3 rounded border border-gray-700">
                <option value="mp4">Video (MP4)</option>
                <option value="mp3">Audio (MP3)</option>
            </select>
            <button onclick="startDownload()" id="btn-dl" class="bg-red-600 px-6 py-3 rounded font-bold hover:bg-red-700">Download</button>
        </div>
        <p id="dl-status" class="text-sm text-gray-400 mt-4 text-center hidden">Processing... This might take a minute.</p>
    </div>
</div>

<!-- TAB 2: EDITOR TOOLS -->
<div id="tab-tools" class="tab-content hidden">
    <div class="grid grid-cols-2 gap-6">
        <!-- Left Column: Inputs -->
        <div class="space-y-4">
            <div class="bg-gray-800 p-4 rounded-xl">
                <h4 class="font-bold mb-2">1. Upload Base Video *</h4>
                <input type="file" id="base-video" accept="video/*" class="w-full bg-gray-900 p-2 rounded border border-gray-700">
            </div>

            <!-- Tool Options -->
            <div class="bg-gray-800 p-4 rounded-xl">
                <h4 class="font-bold mb-2">2. Select Tool</h4>
                <select id="tool-select" onchange="toggleToolOptions()" class="w-full bg-gray-900 p-2 rounded border border-gray-700 mb-3">
                    <option value="trim">✂️ Trim / Cut</option>
                    <option value="extract_audio">🎵 Extract Audio (MP3)</option>
                    <option value="watermark">🖼️ Add Watermark</option>
                    <option value="replace_audio">🔁 Replace Audio Track</option>
                    <option value="merge">📎 Merge Two Videos</option>
                    <option value="volume">🔊 Adjust Volume</option>
                </select>

                <!-- Trim Options -->
                <div id="opt-trim" class="tool-opt space-y-2">
                    <label class="text-sm">Start (seconds)</label>
                    <input type="number" id="trim-start" value="0" class="w-full bg-gray-900 p-2 rounded border border-gray-700">
                    <label class="text-sm">End (seconds)</label>
                    <input type="number" id="trim-end" value="60" class="w-full bg-gray-900 p-2 rounded border border-gray-700">
                </div>

                <!-- Watermark Options -->
                <div id="opt-watermark" class="tool-opt hidden">
                    <label class="text-sm block mb-2">Upload Image Logo</label>
                    <input type="file" id="watermark-img" accept="image/*" class="w-full bg-gray-900 p-2 rounded border border-gray-700">
                </div>

                <!-- Replace Audio Options -->
                <div id="opt-replace_audio" class="tool-opt hidden">
                    <label class="text-sm block mb-2">Upload New Audio Track</label>
                    <input type="file" id="new-audio" accept="audio/*" class="w-full bg-gray-900 p-2 rounded border border-gray-700">
                </div>

                <!-- Merge Options -->
                <div id="opt-merge" class="tool-opt hidden">
                    <label class="text-sm block mb-2">Upload Second Video</label>
                    <input type="file" id="second-video" accept="video/*" class="w-full bg-gray-900 p-2 rounded border border-gray-700">
                </div>

                <!-- Volume Options -->
                <div id="opt-volume" class="tool-opt hidden">
                    <label class="text-sm block mb-2">Volume Multiplier (1.0 = normal, 2.0 = double)</label>
                    <input type="number" id="vol-mult" step="0.1" value="1.0" class="w-full bg-gray-900 p-2 rounded border border-gray-700">
                </div>
            </div>
            <button onclick="processVideo()" id="btn-process" class="w-full bg-purple-600 p-3 rounded font-bold hover:bg-purple-700">Apply Tool</button>
            <p id="process-status" class="text-sm text-gray-400 text-center hidden">Processing via FFmpeg... Please wait.</p>
        </div>

        <!-- Right Column: Ad Space -->
        <div class="bg-gray-800 p-4 text-center min-h-[400px] flex items-center justify-center text-gray-600 border border-dashed border-gray-700">
            Google AdSense Placeholder
        </div>
    </div>
</div>

<script>
    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('bg-blue-600'); btn.classList.add('bg-gray-800'); });
        event.target.classList.remove('bg-gray-800');
        event.target.classList.add('bg-blue-600');
    }

    function toggleToolOptions() {
        const tool = document.getElementById('tool-select').value;
        document.querySelectorAll('.tool-opt').forEach(el => el.classList.add('hidden'));
        const opt = document.getElementById('opt-' + tool);
        if(opt) opt.classList.remove('hidden');
    }

    async function startDownload() {
        const url = document.getElementById('dl-url').value;
        if(!url) return alert("Enter URL");
        const btn = document.getElementById('btn-dl');
        const status = document.getElementById('dl-status');
        btn.disabled = true; status.classList.remove('hidden'); status.innerText = "Fetching metadata & downloading...";

        const fd = new FormData();
        fd.append('url', url);
        fd.append('format', document.getElementById('dl-format').value);

        try {
            const res = await fetch('/api/download', { method: 'POST', body: fd });
            if(!res.ok) throw new Error(await res.text());
            const blob = await res.blob();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = `download.${document.getElementById('dl-format').value}`; a.click();
            status.innerText = "Done! File saved.";
        } catch(e) {
            status.innerText = "Error: " + e.message;
        } finally {
            btn.disabled = false;
        }
    }

    async function processVideo() {
        const baseVideo = document.getElementById('base-video').files[0];
        if(!baseVideo) return alert("Upload a base video first");
        
        const tool = document.getElementById('tool-select').value;
        const btn = document.getElementById('btn-process');
        const status = document.getElementById('process-status');
        btn.disabled = true; status.classList.remove('hidden'); status.innerText = "Uploading & processing... (This uses CPU heavily)";

        const fd = new FormData();
        fd.append('video_file', baseVideo);
        fd.append('tool', tool);

        if(tool === 'trim') {
            fd.append('start_time', document.getElementById('trim-start').value);
            fd.append('end_time', document.getElementById('trim-end').value);
        } else if(tool === 'watermark') {
            const img = document.getElementById('watermark-img').files[0];
            if(!img) return alert("Need image"); fd.append('watermark_image', img);
        } else if(tool === 'replace_audio') {
            const aud = document.getElementById('new-audio').files[0];
            if(!aud) return alert("Need audio"); fd.append('new_audio', aud);
        } else if(tool === 'merge') {
            const vid2 = document.getElementById('second-video').files[0];
            if(!vid2) return alert("Need second video"); fd.append('video_file_2', vid2);
        } else if(tool === 'volume') {
            fd.append('volume_multiplier', document.getElementById('vol-mult').value);
        }

        try {
            const res = await fetch('/api/process-video', { method: 'POST', body: fd });
            if(!res.ok) throw new Error(await res.text());
            const blob = await res.blob();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = `edited_${tool}.mp4`; a.click();
            status.innerText = "Done!";
        } catch(e) {
            status.innerText = "Error: " + e.message;
        } finally {
            btn.disabled = false;
        }
    }
</script>
{% endblock %}
