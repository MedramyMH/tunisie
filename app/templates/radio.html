{% extends "base.html" %}
{% block title %}Radio - TunisiaHub{% endblock %}
{% block content %}
<div class="flex justify-between items-center mb-6">
    <h2 class="text-3xl font-bold">📻 Web Radio</h2>
    <form class="flex gap-2">
        <input type="text" name="q" placeholder="Search stations..." value="{{ request.query_params.get('q', '') }}" class="bg-slate-800 px-4 py-2 rounded border border-slate-600">
        <button class="bg-blue-600 px-4 py-2 rounded hover:bg-blue-700">Search</button>
    </form>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    {% for station in stations %}
    <div class="bg-slate-800 p-4 rounded-lg cursor-pointer hover:bg-slate-700 transition flex items-center gap-4" 
         onclick="playGlobalRadio('{{ station.url_resolved }}', '{{ station.name }}', '{{ station.favicon }}')">
        <img src="{{ station.favicon or '' }}" 
             onerror="this.onerror=null; this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiM5NGEzYjgiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNNCA5djYiLz48cGF0aCBkPSJNOCA2djEyIi8+PHBhdGggZD0iTTEyIDR2MTYiLz48cGF0aCBkPSJNMTYgNnYxMiIvPjxwYXRoIGQ9Ik0yMCA5djYiLz48L3N2Zz4=';"
             class="w-12 h-12 rounded bg-slate-900 flex-shrink-0 object-cover">
        <div class="overflow-hidden">
            <h3 class="font-semibold truncate">{{ station.name }}</h3>
            <p class="text-sm text-slate-400 truncate">{{ station.tags or station.country }}</p>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
