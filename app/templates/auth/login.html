{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-20 bg-slate-800 p-8 rounded-xl shadow-lg">
    <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>
    {% if error %}<p class="text-red-400 text-sm mb-4 text-center">{{ error }}</p>{% endif %}
    <form action="/auth/login" method="POST" class="space-y-4">
        <input type="text" name="username" placeholder="Username" required class="w-full bg-slate-900 p-3 rounded border border-slate-600 focus:border-blue-500 outline-none">
        <input type="password" name="password" placeholder="Password" required class="w-full bg-slate-900 p-3 rounded border border-slate-600 focus:border-blue-500 outline-none">
        <button type="submit" class="w-full bg-blue-600 p-3 rounded font-bold hover:bg-blue-700">Sign In</button>
    </form>
    <p class="text-center text-slate-400 text-sm mt-4">Don't have an account? <a href="/register" class="text-blue-400 hover:underline">Register</a></p>
    <p class="text-center text-slate-500 text-xs mt-2">Register with username "admin" to get Admin rights.</p>
</div>
{% endblock %}
